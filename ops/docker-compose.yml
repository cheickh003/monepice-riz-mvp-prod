version: "3.9"

services:
  medusa:
    build:
      context: ../medusa
      dockerfile: Dockerfile
    container_name: monepiceriz-medusa
    env_file:
      - ../medusa/.env
    ports:
      - "9000:9000"
    depends_on:
      - db
      - redis
      - meilisearch
    restart: unless-stopped

  medusa_v2:
    build:
      context: ../medusa
      dockerfile: Dockerfile.v2
    container_name: monepiceriz-medusa-v2
    env_file:
      - ../medusa/.env
    command: sh -lc "printenv | grep -E '^(DATABASE_URL|REDIS_URL|STORE_CORS|ADMIN_CORS|AUTH_CORS|JWT_SECRET|COOKIE_SECRET)=' > .env && npx medusa db:migrate && npx medusa db:sync-links && npx medusa develop"
    ports:
      - "9001:9000"
    depends_on:
      - db
      - redis
      - meilisearch
    restart: unless-stopped

  admin:
    image: node:20-alpine
    container_name: monepiceriz-admin
    working_dir: /app
    environment:
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://medusa_v2:9000
    command: sh -lc "npx -y @medusajs/admin@latest develop --port 7001"
    ports:
      - "7001:7001"
    depends_on:
      - medusa_v2
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: monepiceriz-db
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    command: ["-c","ssl=on","-c","ssl_cert_file=/certs/server.crt","-c","ssl_key_file=/certs/server.key"]
    ports:
      - "5432:5432"
    volumes:
      - medusa_postgres:/var/lib/postgresql/data
      - ./certs:/certs:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: monepiceriz-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: monepiceriz-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev_meili_master_key_change_me
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  medusa_postgres:
  meili_data:
